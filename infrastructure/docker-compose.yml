name: easycommerce-app

services:
  db:
    image: postgres:15
    container_name: easycommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - easycommerce-network

  # ---------- BACKEND SPRING BOOT ----------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: easycommerce-app
    restart: unless-stopped
    environment:
      DB_NAME: jdbc:postgresql://db:5432/${POSTGRES_DB:-easyecommerce}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env.example}
      PORT: 8081
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
    depends_on:
      db:
        condition: service_healthy

    networks:
      - easycommerce-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: easycommerce-frontend
    restart: unless-stopped
    depends_on:
      - app

    ports:
      - "127.0.0.1:8082:80"

    networks:
      - easycommerce-network
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: easycommerce-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@easycommerce.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defini PGADMIN_PASSWORD en .env.example}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - easycommerce-network  

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: easycommerce-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - easycommerce-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: easycommerce-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Defini GRAFANA_PASSWORD en .env.example}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - easycommerce-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: easycommerce-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-easyecommerce}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env.example}
    networks:
      - easycommerce-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: easycommerce-node-exporter
    restart: unless-stopped
    profiles: ["linux"]
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - easycommerce-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: easycommerce-cadvisor
    restart: unless-stopped
    profiles: ["linux"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
    networks:
      - easycommerce-network

  # ---------- Automatizacion ----------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Defini N8N_VERSION en .env.example (version estable y parcheada)}
    container_name: easycommerce-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-America/Argentina/Jujuy}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Jujuy}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      NODE_ENV: production
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defini N8N_ENCRYPTION_KEY en .env.example}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.git","n8n-nodes-base.ssh"]'
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    security_opt:
      - no-new-privileges:true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: 
      - easycommerce-network
    
  db-backup:
    build: ./backup
    container_name: easycommerce-db-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env.example}
      PGDATABASE: ${POSTGRES_DB:-easyecommerce}
      BACKUP_TOKEN: ${BACKUP_TOKEN:?Defini BACKUP_TOKEN en .env.example}
    volumes:
      - backups_data:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - easycommerce-network
 # ---------- Gestion de incidencias: MantisBT ----------
  # Base propia (MariaDB), separada de la PostgreSQL de la aplicacion.
  mantis-db:
    image: mariadb:11.4
    container_name: easycommerce-mantis-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MANTIS_DB_NAME:-bugtracker}
      MARIADB_USER: ${MANTIS_DB_USER:-mantisbt}
      MARIADB_PASSWORD: ${MANTIS_DB_PASSWORD:?Defini MANTIS_DB_PASSWORD en .env.example}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mantis_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - easycommerce-network
  mantisbt:
    image: xlrl/mantisbt:${MANTIS_VERSION:?Defini MANTIS_VERSION en .env.example (tag fijo, no latest)}
    container_name: easycommerce-mantisbt
    restart: unless-stopped
    environment:
      MANTIS_TIMEZONE: ${TZ:-America/Argentina/Jujuy}
      MANTIS_ENABLE_ADMIN: ${MANTIS_ENABLE_ADMIN:-0}
      PHP_MAX_UPLOAD_SIZE: ${MANTIS_MAX_UPLOAD:-5M}
    ports:
      - "127.0.0.1:${MANTIS_PORT:-8083}:80"
    volumes:
      - mantis_config:/var/www/html/config
      - mantis_custom:/var/www/html/custom
    depends_on:
      mantis-db:
        condition: service_healthy
    networks:
      - easycommerce-network


networks:
  easycommerce-network:
    name: easycommerce-network   # nombre fijo para que el compose de tools se pueda unir
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  n8n_data:
  backups_data:
  mantis_db_data:
  mantis_config:
  mantis_custom: